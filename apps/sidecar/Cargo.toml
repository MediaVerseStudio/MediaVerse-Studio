[package]
name = "mediaverse_sidecar"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mediaverse_accuraterip = { path = "../../crates/accuraterip" }
mediaverse_disc_metadata = { path = "../../crates/disc-metadata" }
mediaverse_host = { path = "../../crates/host" }
mediaverse_ripper = { path = "../../crates/ripper" }
mediaverse_library_filesystem = { path = "../../crates/adapters/library-filesystem" }
# Tag repair (ADR 0009): recognising album folders and proposing missing tags.
mediaverse_tag_repair = { path = "../../crates/tag-repair" }
mediaverse_lyric_ai = { path = "../../crates/lyric-ai" }
mediaverse_lyric_engine = { path = "../../crates/lyric-engine" }
# Lyrics by photo: reads booklet pictures with the PP-OCRv5 models (a separate download) and lays the text out as songs.
mediaverse_page_reader = { path = "../../crates/page-reader" }
# Reading tags and exact lengths for tag repair; already linked through the library's tag adapter (D31).
lofty = "0.22.4"
# Writing the fixes the person applies (only the fields filled, through a checked copy); our own crate.
mediaverse_metadata_tags = { path = "../../crates/adapters/metadata-tags" }
# Defect scan results (ADR 0008); the same bundled SQLite the library database already uses.
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
# HTTP and HTTPS. TLS uses the operating system's own stack (SChannel on Windows) through
# native-tls, so no cryptography library is bundled. Approved by the owner 2026-10-31.
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
# The independent MP3 decoder (also used by the ripper), for defect scans of library MP3s.
nanomp3 = { version = "0.2.0", default-features = false, features = ["std"] }
# The FLAC decoder the ripper already uses (provenance.toml), for exclusive-mode playback of FLAC at any sample rate and depth (native_pcm.rs).
claxon = "=0.4.3"
# Chromaprint audio fingerprints for AcoustID (pure Rust, MIT; approved by the owner, D35). Used only by `fingerprint.rs`.
rusty-chromaprint = "=0.3.0"

# Windows' own audio decoders (Media Foundation), for converting AAC/M4A, WMA, FLAC and WAV files to MP3 on the PC.
# Microsoft's crate (MIT or Apache-2.0); approved by the owner 2026-11-04. Decoding uses the codecs Windows already
# licenses and ships, so no codec of our own is bundled. Used by `windows_decode.rs` and, for the exclusive (WASAPI) sound output, `native_wasapi.rs` (the audio-device parts of the same crate; no new dependency).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Media_Audio", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Threading", "Win32_System_Variant", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem"] }
