[[source]]
name = "rusty-chromaprint (Rust crate), for AcoustID fingerprints"
role = "Pure-Rust Chromaprint fingerprints of ripped tracks (and, later, library songs) for AcoustID lookups (apps/sidecar/src/fingerprint.rs, audio_check.rs)"
upstream_url = "https://github.com/darksv/rusty-chromaprint"
revision = "0.3.0 (crates.io, 2024-10); dependencies rubato 0.16 and rustfft 6.2 (both MIT OR Apache-2.0)"
license = "MIT (declared in the crate's Cargo.toml; the repository has no LICENSE file, so notices quote the crate metadata). It is described as a port of Chromaprint, whose own code is MIT (Copyright Lukas Lalinsky); Chromaprint's LGPL-2.1 part is bundled FFmpeg code, which this port replaces with rubato and rustfft."
license_review = "2026-11-03: checked online (crate metadata, its README, Chromaprint's LICENSE.md). No conflict with GPL-3.0-only: the ported code is MIT, and even LGPL-2.1 code could be used under GPL terms. Owner approved (D35). 2026-11-16: added to the build (pinned =0.3.0, with rubato 0.16.2 and rustfft 6.4.1 from Cargo.lock) and tested: fingerprints made by this crate (preset test2, the default of AcoustID's fpcalc) of two real songs decoded from MP3 were recognised by AcoustID's live service with scores 0.98 and 0.97 (D113)."
integration = "Dependency of apps/sidecar; linked into the sidecar. Fingerprints the first two minutes of each track."
approved_for_build = true

