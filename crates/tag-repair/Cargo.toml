[package]
name = "mediaverse_tag_repair"
version.workspace = true
edition.workspace = true
license.workspace = true

# Tag repair (ADR 0009): recognising album folders from their files and proposing missing tags. Pure logic: no
# network or file access here; the sidecar reads the files, asks the services and writes the tags.
[dependencies]
mediaverse_disc_metadata = { path = "../disc-metadata" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
